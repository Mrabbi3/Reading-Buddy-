<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Buddy — Web</title>

  <!-- Fonts (Fraunces + Hanken Grotesk, served locally) -->
  <link rel="stylesheet" href="fonts.css" />
  <!-- App styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Image resources used by the landing page -->
  <script>
    window.__resources = {
      webHero: 'images/web-hero.png',
      iosPromo: 'images/ios-promo.png',
    };
  </script>

  <!-- Vendor: React, ReactDOM, Babel (standalone, transpiles the JSX below) -->
  <script src="vendor/react.js"></script>
  <script src="vendor/react-dom.js"></script>
  <script src="vendor/babel.min.js"></script>

  <!-- App source (load order matters: deps before the root) -->
  <script type="text/babel" data-presets="react" src="src/icons.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/reader2.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/web-landing.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/web-reader.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/web-app.jsx"></script>
</body>
</html>
